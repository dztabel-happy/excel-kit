name: Build verified release programs

# Public runners; private source is checked out only for a maintainer-triggered
# build. No pull_request/push trigger, shared cache, source or log artifact.
on:
  workflow_dispatch:
    inputs:
      core_sha:
        description: Exact private core SHA recorded in release.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: excel-kit-public-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout distribution metadata
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: public
          persist-credentials: false
      - name: Require frozen release input
        env:
          CORE_SHA: ${{ inputs.core_sha }}
        run: |
          python3 - <<'PY'
          import json, os, re
          expected = json.load(open('public/release.json'))
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['CORE_SHA'])
          assert os.environ['CORE_SHA'] == expected['sourceCommit']
          PY
      - name: Checkout private core with read-only deploy key
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: dztabel-happy/excel-kit-core
          ref: ${{ inputs.core_sha }}
          path: core
          ssh-key: ${{ secrets.CORE_DEPLOY_KEY }}
          persist-credentials: false
          sparse-checkout: |
            src
            scripts
            tests
          fetch-depth: 1
      - name: Install fixed Bun runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Build three programs without exposing private diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cd core
          test "$(bun --version)" = 1.4.2
          if ! bun install --frozen-lockfile > "$RUNNER_TEMP/excel-kit-install.log" 2>&1; then
            echo 'Dependency installation failed. Private diagnostics are not published.'
            exit 1
          fi
          if ! bun run scripts/build.ts --outdir "$RUNNER_TEMP/excel-kit-programs" > "$RUNNER_TEMP/excel-kit-build.log" 2>&1; then
            echo 'Build failed. Private diagnostics are not published.'
            exit 1
          fi
      - name: Verify bytes against accepted programs
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          metadata = json.load(open('public/release.json'))
          folder = Path(os.environ['RUNNER_TEMP']) / 'excel-kit-programs'
          for item in metadata['artifacts']:
              name = 'excel-kit-' + item['platform'] + ('.exe' if item['platform'].startswith('windows') else '')
              data = (folder / name).read_bytes()
              if len(data) != item['bytes'] or hashlib.sha256(data).hexdigest() != item['sha256']:
                  raise SystemExit('Binary identity mismatch: ' + item['platform'] + '. Nothing is published.')
              print(item['platform'] + ': verified')
          PY
      - name: Verify runnable version
        run: |
          if [ "$(uname -m)" = arm64 ]; then
            "$RUNNER_TEMP/excel-kit-programs/excel-kit-macos-arm64" version
          else
            "$RUNNER_TEMP/excel-kit-programs/excel-kit-macos-x64" version
          fi
      - name: Upload only the three verified programs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-programs
          path: |
            ${{ runner.temp }}/excel-kit-programs/excel-kit-macos-arm64
            ${{ runner.temp }}/excel-kit-programs/excel-kit-macos-x64
            ${{ runner.temp }}/excel-kit-programs/excel-kit-windows-x64.exe
          retention-days: 1
          if-no-files-found: error
      - name: Remove private checkout and diagnostic files
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/core"
          rm -f -- "$RUNNER_TEMP/excel-kit-install.log" "$RUNNER_TEMP/excel-kit-build.log"
          rm -f -- "$RUNNER_TEMP/excel-kit-programs/manifest.json" "$RUNNER_TEMP/excel-kit-programs/THIRD-PARTY-NOTICES.txt"
