name: Verify installed ExcelKit
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      core_sha:
        required: true
        type: string
      candidate:
        type: boolean
        default: false
permissions:
  actions: read
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.candidate
        with:
          name: release-packages
      - name: Install in an empty directory and exercise the installed CLI
        env:
          VERSION: ${{ inputs.version }}
          CORE_SHA: ${{ inputs.core_sha }}
          CANDIDATE: ${{ inputs.candidate }}
        shell: bash
        run: |
          set -eu
          if [[ "$CANDIDATE" == true ]]; then
            platform=$(node -p "process.platform+'-'+process.arch")
            npm install --prefix install-test --cache install-cache --offline --ignore-scripts --no-audit --no-fund "./npm/dztabel-excel-kit-$VERSION.tgz" "./npm/dztabel-excel-kit-$platform-$VERSION.tgz"
          else
            npm install --prefix install-test --cache install-cache --include=optional --no-audit --no-fund --registry=https://registry.npmjs.org/ "@dztabel/excel-kit@$VERSION"
          fi
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const { createHash } = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const scope = path.resolve('install-test/node_modules/@dztabel');
          const main = path.join(scope, 'excel-kit');
          const expected = require(path.join(main, 'release.json'));
          assert.equal(expected.version, process.env.VERSION);
          assert.equal(expected.packageSourceCommit, process.env.CORE_SHA);
          const win = process.platform === 'win32';
          const platform = win ? 'windows-x64' : 'macos-' + process.arch;
          const artifact = expected.artifacts.find(item => item.platform === platform);
          const binary = path.join(scope, 'excel-kit-' + process.platform + '-' + (win ? 'x64' : process.arch), 'bin', artifact.binary);
          assert.equal(createHash('sha256').update(fs.readFileSync(binary)).digest('hex'), artifact.sha256);
          const cli = (...args) => execFileSync(process.execPath, [path.join(main, 'bin/excel-kit.cjs'), ...args], { encoding: 'utf8' });
          const version = JSON.parse(cli('version'));
          assert.equal(version.cli, expected.version);
          assert.equal(version.build.inputs, artifact.build.inputs);
          assert.match(cli('help', 'range.transfer'), /expectedTargetVersion/);
          assert.match(cli('help', 'session.script'), /trial/);
          const skill = path.join(main, 'skills/excel-kit');
          const topics = fs.readdirSync(path.join(skill,'reference')).filter(s => s.endsWith('.md'));
          assert.equal(topics.length, 19);
          const entry = fs.readFileSync(path.join(skill,'SKILL.md'),'utf8');
          for (const topic of topics) assert.ok(entry.includes('reference/' + topic), topic);
          for (const name of ['SKILL.md', ...topics.map(n => 'reference/' + n)]) {
            const doc = path.join(skill, name);
            for (const match of fs.readFileSync(doc,'utf8').matchAll(/\[[^\]\n]+\]\(([^)]+)\)/g)) {
              const link = match[1];
              if (!link.startsWith('#') && !/^https?:/.test(link)) assert.ok(fs.statSync(path.resolve(path.dirname(doc), link.split('#')[0])).isFile(), link);
            }
          }
          assert.equal(fs.statSync(path.join(main,'README.md')).size, 0);
          assert.ok(fs.statSync(path.join(main,'USAGE.md')).size > 0);
          console.log(platform, version.cli, artifact.sha256);
          JS
          pkg=install-test/node_modules/@dztabel/excel-kit
          cp -R "$pkg/recipes/update-assumptions" example
          (cd example && node "../$pkg/bin/excel-kit.cjs" script request.json > receipt.json)
          if [[ "$CANDIDATE" == true && "$RUNNER_OS" == macOS ]]; then
            unzip -q "packages/excel-kit-$VERSION-macos-x64.zip" -d intel
            test -s intel/README.md
            ./intel/excel-kit version > intel-version.json
            node -e "if(require('./intel-version.json').cli!==process.env.VERSION)process.exit(1)"
            (cd intel/recipes/update-assumptions && ../../excel-kit script request.json > receipt.json)
          fi
          python3 -X utf8 - <<'PYTHON'
          import json
          from pathlib import Path
          from zipfile import ZipFile
          import xml.etree.ElementTree as ET
          for example in [Path('example'), *Path('intel').glob('recipes/update-assumptions')]:
              assert json.loads((example / 'receipt.json').read_text(encoding='utf-8'))['ok']
              with ZipFile(example / 'cost-model-updated.xlsx') as z:
                  sheets = ET.fromstring(z.read('xl/workbook.xml'))
                  sheet = next(s for s in sheets.findall('.//{*}sheet') if s.get('name') == '汇总')
                  rid = sheet.get('{http://schemas.openxmlformats.org/officeDocument/2006/relationships}id')
                  rel = next(r for r in ET.fromstring(z.read('xl/_rels/workbook.xml.rels')) if r.get('Id') == rid)
                  target = rel.get('Target')
                  xml = ET.fromstring(z.read(target.lstrip('/') if target.startswith('/') else 'xl/' + target))
                  for address, expected in [('B2', 59535000), ('B3', 4961.25)]:
                      cell = xml.find(f'.//{{*}}c[@r="{address}"]')
                      assert cell.find('{*}f') is not None and float(cell.findtext('{*}v')) == expected
          PYTHON
