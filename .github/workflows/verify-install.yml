name: Verify public npm installation
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      core_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Install from registry with a fresh cache and verify the selected binary
        env:
          VERSION: ${{ inputs.version }}
          CORE_SHA: ${{ inputs.core_sha }}
        shell: bash
        run: |
          set -eu
          npm install --prefix ./install-test --cache ./install-cache --include=optional --no-audit --no-fund --registry=https://registry.npmjs.org/ "@dztabel/excel-kit@$VERSION"
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const { createHash } = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const scope = path.resolve('install-test/node_modules/@dztabel');
          const main = path.join(scope, 'excel-kit');
          const expected = require(path.join(main, 'release.json'));
          assert.equal(expected.version, process.env.VERSION);
          assert.equal(expected.sourceCommit, process.env.CORE_SHA);
          const win = process.platform === 'win32';
          const platform = win ? 'windows-x64' : 'macos-' + process.arch;
          const artifact = expected.artifacts.find(item => item.platform === platform);
          const binary = path.join(scope, 'excel-kit-' + process.platform + '-' + (win ? 'x64' : process.arch), 'bin', artifact.binary);
          assert.equal(createHash('sha256').update(fs.readFileSync(binary)).digest('hex'), artifact.sha256);
          const cli = (...args) => execFileSync(process.execPath, [path.join(main, 'bin/excel-kit.cjs'), ...args], { encoding: 'utf8' });
          const version = JSON.parse(cli('version'));
          assert.equal(version.cli, expected.version);
          assert.equal(version.build.inputs, artifact.build.inputs);
          assert.match(cli('help', 'range.transfer'), /expectedTargetVersion/);
          assert.match(cli('help', 'session.script'), /trial/);
          assert.ok(fs.existsSync(path.join(main, 'reference/sessions.md')));
          console.log(platform, version.cli, artifact.sha256);
          JS
